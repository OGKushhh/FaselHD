name: Build nfshd.exe

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Install Playwright Chromium
        run: |
          playwright install chromium
          playwright install-deps chromium

      - name: Verify icon exists
        shell: pwsh
        run: |
          if (Test-Path src\icon.ico) {
            Write-Host "Found src\icon.ico"
          } else {
            Write-Host "[WARNING] src\icon.ico not found — building without icon"
          }

      - name: Build EXE with PyInstaller
        run: pyinstaller nfshd.spec --noconfirm

      - name: Verify EXE exists
        shell: pwsh
        run: |
          if (Test-Path dist\nfshd.exe) {
            Write-Host "nfshd.exe built successfully"
            Get-Item dist\nfshd.exe | Format-List Name,Length
          } else {
            Write-Error "ERROR: nfshd.exe not found in dist/"
            exit 1
          }

      - name: Create ZIP archive
        shell: pwsh
        run: |
          Compress-Archive -Path dist\nfshd.exe -DestinationPath dist\nfshd.zip -Force

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: nfshd-windows
          path: dist/nfshd.exe
          retention-days: 30

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: nfshd-windows-zip
          path: dist/nfshd.zip
          retention-days: 30

      # ── Release: only on version tags (v1.0, v2.1, etc.) ──
      - name: Generate changelog from commits
        if: startsWith(github.ref, 'refs/tags/v')
        id: changelog
        run: |
          $tag = "${{ github.ref_name }}"
          $prevTag = git describe --tags --abbrev=0 HEAD^ 2>$null
          if ($LASTEXITCODE -ne 0) { $prevTag = "" }
          if ($prevTag) {
            $log = git log "$prevTag..HEAD" --pretty=format:"- %s (%h)" --no-merges
          } else {
            $log = git log --pretty=format:"- %s (%h)" --no-merges -20
          }
          echo "BODY=$log" | Out-File -Append $env:GITHUB_ENV
          echo "VERSION=$tag" | Out-File -Append $env:GITHUB_ENV

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: nfshd ${{ env.VERSION }}
          body: |
            ## nfshd ${{ env.VERSION }}

            FaselHD CLI — search, browse, and stream movies/series directly to your player.

            ### Changes
            ${{ env.BODY }}

            ### How to use
            1. Download `nfshd.exe` (or `nfshd.zip`)
            2. Run it — requires [VLC](https://www.videolan.org/) or [mpv](https://mpv.io/) for playback
            3. Chromium is embedded — no separate browser install needed
          files: |
            dist/nfshd.exe
            dist/nfshd.zip
          draft: false
          prerelease: false
