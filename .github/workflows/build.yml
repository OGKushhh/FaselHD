name: Build nfshd.exe

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      changelog:
        description: 'Release notes (optional — auto-generated from commits if empty)'
        required: false
        default: ''
      version:
        description: 'Version tag (e.g. v1.0) — only used for manual releases'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Verify icon
        shell: pwsh
        run: |
          if (Test-Path src\icon.ico) { Write-Host "Found icon.ico" }
          else { Write-Host "[WARN] No icon.ico" }

      - name: Build EXE
        run: pyinstaller nfshd.spec --noconfirm

      - name: Verify EXE
        shell: pwsh
        run: |
          if (Test-Path dist\nfshd.exe) {
            $size = (Get-Item dist\nfshd.exe).Length / 1MB
            Write-Host "nfshd.exe built — $([math]::Round($size, 1)) MB"
          } else {
            Write-Error "nfshd.exe not found!"
            exit 1
          }

      - name: ZIP
        shell: pwsh
        run: Compress-Archive -Path dist\nfshd.exe -DestinationPath dist\nfshd.zip -Force

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: nfshd-windows
          path: dist/nfshd.exe
          retention-days: 30

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: nfshd-windows-zip
          path: dist/nfshd.zip
          retention-days: 30

      # ── Release ──
      - name: Determine version
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.ref_name }}" -match "^v") {
            echo "TAG=${{ github.ref_name }}" >> $env:GITHUB_OUTPUT
          } elseif ("${{ inputs.version }}" -ne "") {
            echo "TAG=${{ inputs.version }}" >> $env:GITHUB_OUTPUT
          } else {
            echo "TAG=" >> $env:GITHUB_OUTPUT
          }

      - name: Generate changelog
        id: cl
        shell: pwsh
        run: |
          $custom = "${{ inputs.changelog }}"
          if ($custom -ne "") {
            # Manual changelog provided
            echo "BODY<<EOF" >> $env:GITHUB_OUTPUT
            echo "$custom" >> $env:GITHUB_OUTPUT
            echo "EOF" >> $env:GITHUB_OUTPUT
          } else {
            # Auto-generate from git commits
            $tag = "${{ steps.ver.outputs.TAG }}"
            $prevTag = ""
            try { $prevTag = git describe --tags --abbrev=0 HEAD^ 2>$null } catch {}
            if ($prevTag -and $tag) {
              $log = git log "$prevTag..HEAD" --pretty=format:"- %s" --no-merges
            } else {
              $log = git log --pretty=format:"- %s" --no-merges -20
            }
            echo "BODY<<EOF" >> $env:GITHUB_OUTPUT
            echo "$log" >> $env:GITHUB_OUTPUT
            echo "EOF" >> $env:GITHUB_OUTPUT
          }

      - name: Create Release
        if: steps.ver.outputs.TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.TAG }}
          name: nfshd ${{ steps.ver.outputs.TAG }}
          body: |
            ## nfshd ${{ steps.ver.outputs.TAG }}

            ${{ steps.cl.outputs.BODY }}

            ### How to use
            1. Download `nfshd.exe`
            2. Run it — Chromium installs automatically on first launch
            3. Requires [VLC](https://www.videolan.org/) or [mpv](https://mpv.io/) for playback
          files: |
            dist/nfshd.exe
            dist/nfshd.zip
          draft: false
          prerelease: false
